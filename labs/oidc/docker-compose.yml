# Lab OIDC — SIMULATION. Realm "nc-connect-sim", jamais le vrai NC Connect.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: oidc-lab-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - ./realm-nc-connect-sim.json:/opt/keycloak/data/import/realm-nc-connect-sim.json:ro
