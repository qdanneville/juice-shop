# Même exposition que la version vulnérable (pour atteindre l'app depuis le poste
# via k3d). En production on préférerait un ClusterIP + Ingress, mais ce n'est pas
# le défaut traité par ce lab : la segmentation vient de la NetworkPolicy (05-).
apiVersion: v1
kind: Service
metadata:
  name: juice-shop
  namespace: juice-shop-lab
spec:
  type: NodePort
  selector:
    app: juice-shop
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30000
