# Contre-mesure défaut 4a : LE SECRET NE VIT PLUS DANS LE DÉPÔT.
#
# Ce fichier est un EXEMPLE (suffixe .example) — il n'est pas appliqué tel quel et
# ne contient AUCUNE vraie valeur. Deux façons de faire « bien » :
#
# 1) Lab (le plus simple) : créer le secret hors manifeste, à la volée, de sorte
#    que la valeur ne soit jamais écrite dans un fichier versionné :
#
#      kubectl -n juice-shop-lab create secret generic juice-db-credentials \
#        --from-literal=db-password="$(openssl rand -base64 24)"
#
# 2) Production : un opérateur synchronise le secret depuis un COFFRE (chapitre 07) —
#    Vault, AWS/GCP Secrets Manager… — via External Secrets Operator. Esquisse :
#
# apiVersion: external-secrets.io/v1beta1
# kind: ExternalSecret
# metadata:
#   name: juice-db-credentials
#   namespace: juice-shop-lab
# spec:
#   secretStoreRef:
#     name: vault-backend
#     kind: SecretStore
#   target:
#     name: juice-db-credentials
#   data:
#     - secretKey: db-password
#       remoteRef:
#         key: juice-shop/db
#         property: password
#
# Dans les deux cas, le dépôt ne contient QUE la référence, jamais la valeur.
