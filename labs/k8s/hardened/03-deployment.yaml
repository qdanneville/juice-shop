# Déploiement DURCI — compatible Pod Security Standards `restricted`.
# Contre-mesures :
#  - Défaut 1 : plus de privileged, plus de hostPath ; runAsNonRoot, capabilities
#               droppées, readOnlyRootFilesystem, seccomp RuntimeDefault.
#  - Défaut 2a : automountServiceAccountToken = false (aucun jeton monté).
#  - Défaut 4b : resources.requests ET resources.limits (plancher anti-DoS).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: juice-shop
  namespace: juice-shop-lab
  labels:
    app: juice-shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: juice-shop
  template:
    metadata:
      labels:
        app: juice-shop
    spec:
      serviceAccountName: juice-sa
      automountServiceAccountToken: false       # défaut 2a corrigé
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: juice-shop
          image: bkimminich/juice-shop:v20.3.0
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "unsafe"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: juice-db-credentials     # créé hors dépôt (cf. 01-secret.example.yaml)
                  key: db-password
          securityContext:                       # défaut 1 corrigé
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:                             # défaut 4b corrigé
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          volumeMounts:
            # readOnlyRootFilesystem=true impose de monter en écriture UNIQUEMENT
            # les chemins dont l'app a réellement besoin (ici /tmp). Voir la note
            # du README : Juice Shop écrit aussi dans ses dossiers logs/ftp/uploads ;
            # en durcissement réel on ajoute un emptyDir par chemin, pas un FS ouvert.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
