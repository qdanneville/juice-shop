# Défaut 4a : SECRET EN CLAIR DANS LE DÉPÔT.
# `base64` n'est PAS du chiffrement : `echo UzNjckV0X1Ahc3N3MHJkXzIwMjQ= | base64 -d`
# révèle la valeur en une seconde. Committer ce fichier = fuite du secret pour
# quiconque lit le dépôt (ou le livrable, cf. Misplaced IaC Files, défi B).
# Correctif : secret géré HORS dépôt (coffre / External Secrets), cf. hardened/.
apiVersion: v1
kind: Secret
metadata:
  name: juice-db-credentials
  namespace: juice-shop-lab
type: Opaque
data:
  # "S3crEt_P!ssw0rd_2024" encodé en base64 — trivialement réversible
  db-password: UzNjckV0X1Ahc3N3MHJkXzIwMjQ=
