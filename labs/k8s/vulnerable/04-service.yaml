# Expose Juice Shop dans le cluster. Le mapping de port vers l'hôte est fait par
# k3d (voir setup.sh : --port "3000:30000@loadbalancer"), on tombe alors sur
# http://localhost:3000 depuis le poste.
apiVersion: v1
kind: Service
metadata:
  name: juice-shop
  namespace: juice-shop-lab
spec:
  type: NodePort
  selector:
    app: juice-shop
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30000
